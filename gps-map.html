<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus GPS | CampusAccess</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <link rel="stylesheet" href="css/style.css">

    <style>

        .gps-container {
            margin-top: 30px;
        }

        #campusMap {
            width: 100%;
            height: 600px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            border: 1px solid #ddd;
        }

        .gps-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .gps-button {
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            background: #2563eb;
            color: white;
        }

        .gps-button:hover {
            opacity: 0.9;
        }

        .location-status {
            margin-top: 15px;
            padding: 14px;
            border-radius: 10px;
            background: #f1f5f9;
        }

    </style>

</head>


<body>


<header class="navbar">

    <a class="logo" href="index.html">
        ♿ CampusAccess
    </a>

    <nav>

        <a href="index.html">Home</a>

        <a href="buildings.html">Buildings</a>

        <a href="gps-map.html" class="active">
            GPS Map
        </a>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="add-building.html">
            Add Record
        </a>

    </nav>

</header>



<main class="section">

    <span class="tag">
        CAMPUS NAVIGATION
    </span>

    <h1>
        Campus GPS Map
    </h1>

    <p class="page-description">

        Find your current location and explore accessible campus buildings.

    </p>



    <div class="gps-controls">

        <button class="gps-button"
                onclick="findMyLocation()">

            📍 Find My Location

        </button>


        <button class="gps-button"
                onclick="goToCampus()">

            🏫 Go to Campus

        </button>

    </div>



    <div id="campusMap"></div>


    <div id="locationStatus"
         class="location-status">

        📍 Click "Find My Location" to detect your current location.

    </div>


</main>



<footer>

    Campus Accessibility Portal • CSE326 HTML Project

</footer>



<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>



<script>


/* ================================
   CAMPUS LOCATION
================================ */

const campusLatitude = 31.2559;

const campusLongitude = 75.7033;



/* ================================
   CREATE MAP
================================ */

const map = L.map("campusMap").setView(
    [campusLatitude, campusLongitude],
    16
);



/* ================================
   NORMAL MAP
================================ */

const normalMap = L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 20,
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);



/* ================================
   SATELLITE MAP
================================ */

const satelliteMap = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
        maxZoom: 19,
        attribution: "Tiles &copy; Esri"
    }
);



/* ================================
   CAMPUS MARKER
================================ */

const campusMarker = L.marker(
    [campusLatitude, campusLongitude]
).addTo(map);


campusMarker.bindPopup(

    "<b>🏫 Campus</b><br>" +
    "CampusAccess Navigation"

);



/* ================================
   BUILDINGS
================================ */

const buildings = [

    {
        name: "Block 32",
        latitude: 31.2562,
        longitude: 75.7028,
        accessibility: "♿ Highly Accessible"
    },

    {
        name: "Block 34",
        latitude: 31.2557,
        longitude: 75.7030,
        accessibility: "🟡 Partially Accessible"
    },

    {
        name: "Block 36",
        latitude: 31.2554,
        longitude: 75.7036,
        accessibility: "♿ Highly Accessible"
    },

    {
        name: "Library",
        latitude: 31.2558,
        longitude: 75.7040,
        accessibility: "♿ Highly Accessible"
    },

    {
        name: "Admin Block",
        latitude: 31.2564,
        longitude: 75.7038,
        accessibility: "🟡 Partially Accessible"
    },

    {
        name: "Engineering Block",
        latitude: 31.2549,
        longitude: 75.7027,
        accessibility: "🔴 Needs Improvement"
    }

];



/* ================================
   ADD BUILDING MARKERS
================================ */

buildings.forEach(function(building) {

    const marker = L.marker([

        building.latitude,

        building.longitude

    ]).addTo(map);


    marker.bindPopup(

        "<b>🏢 " +
        building.name +
        "</b><br><br>" +

        building.accessibility

    );

});



/* ================================
   MAP TYPE CONTROL
================================ */

const mapLayers = {

    "🗺️ Normal Map": normalMap,

    "🛰️ Satellite": satelliteMap

};


L.control.layers(mapLayers).addTo(map);



/* ================================
   FIND MY LOCATION
================================ */

function findMyLocation() {


    const status =
        document.getElementById("locationStatus");


    status.innerHTML =
        "📍 Finding your location...";


    if (!navigator.geolocation) {

        status.innerHTML =
            "❌ GPS is not supported by your browser.";

        return;

    }


    navigator.geolocation.getCurrentPosition(

        function(position) {


            const latitude =
                position.coords.latitude;


            const longitude =
                position.coords.longitude;


            const accuracy =
                position.coords.accuracy;



            map.setView(

                [latitude, longitude],

                18

            );



            const userMarker =
                L.marker([

                    latitude,

                    longitude

                ]).addTo(map);



            userMarker.bindPopup(

                "<b>📍 You are here</b><br>" +

                "Accuracy: " +

                Math.round(accuracy) +

                " meters"

            ).openPopup();



            L.circle(

                [latitude, longitude],

                {

                    radius: accuracy

                }

            ).addTo(map);



            status.innerHTML =

                "📍 <b>Your location detected!</b><br>" +

                "Latitude: " +

                latitude.toFixed(6) +

                "<br>" +

                "Longitude: " +

                longitude.toFixed(6) +

                "<br>" +

                "Accuracy: approximately " +

                Math.round(accuracy) +

                " meters.";

        },


        function(error) {


            status.innerHTML =

                "❌ Unable to get your location.<br>" +

                "Please allow location permission in your browser.";

        },

        {

            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 0

        }

    );

}



/* ================================
   GO TO CAMPUS
================================ */

function goToCampus() {

    map.setView(

        [campusLatitude, campusLongitude],

        17

    );

}

</script>


</body>

</html>
